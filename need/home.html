<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Ubuntu:ital,wght@0,300;0,400;0,500;0,700;1,300;1,400;1,500;1,700&display=swap" rel="stylesheet">

    <script src="https://kit.fontawesome.com/a1bb3c16d0.js" crossorigin="anonymous"></script>

    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.5.1/dist/chart.umd.min.js"></script>

    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="style/home.css">

    <title>NeED • Home</title>
</head>
<body>
    <div class="panel main-panel">
        <div class="average-panel">
            <div style="display: flex; flex-direction: column; align-items: flex-start; gap: 1vh;">
                <h1 style="font-size: 3rem;">15,48 <span style="font-size: 1rem; color: #ebeaea;">/20</span></h1>
                <h3 style="font-size: 0.8rem; margin-left: 2vw; color: #ebeaea">Rang 12/32</h3>
            </div>
            <div style="display: flex; flex-direction: column; align-items: center;">
                <h5>Dernière Note</h5>
                <h4>14,18</h4>
            </div>
        </div>
        <div class="chart-section">
            <canvas id="average-chart"></canvas>
            <canvas id="subject-chart"></canvas>
        </div>
    </div>
    <div class="subjects-container">
        <div class="panel subject-panel">
            <h5>Maths</h5>
            <h4 class="subject-average">12,28</h4>
            <div style="gap: 0.5rem;" class="stats">
                <h6><i class="fa-solid fa-ranking-star"></i> 12/32</h6>
                <h6><i class="fa-solid fa-users"></i> 15,46</h6>
            </div>
        </div>
        <div class="panel subject-panel">
            <h5>ES PC</h5>
            <h4 class="subject-average">14,68</h4>
            <div style="gap: 0.5rem;" class="stats">
                <h6><i class="fa-solid fa-ranking-star"></i> 16/32</h6>
                <h6><i class="fa-solid fa-users"></i> 12,16</h6>
            </div>
        </div>
        <div class="panel subject-panel">
            <h5>ES SVT</h5>
            <h4 class="subject-average">17,95</h4>
            <div style="gap: 0.5rem;" class="stats">
                <h6><i class="fa-solid fa-ranking-star"></i> 3/32</h6>
                <h6><i class="fa-solid fa-users"></i> 14,34</h6>
            </div>
        </div>
        <div class="panel subject-panel">
            <h5>Anglais</h5>
            <h4 class="subject-average">16,12</h4>
            <div style="gap: 0.5rem;" class="stats">
                <h6><i class="fa-solid fa-ranking-star"></i> 4/32</h6>
                <h6><i class="fa-solid fa-users"></i> 13,34</h6>
            </div>
        </div>
        <div class="panel subject-panel">
            <h5>Allemand</h5>
            <h4 class="subject-average">16,87</h4>
            <div style="gap: 0.5rem;" class="stats">
                <h6><i class="fa-solid fa-ranking-star"></i> 12/32</h6>
                <h6><i class="fa-solid fa-users"></i> 16,84</h6>
            </div>
        </div>
        <div class="panel subject-panel">
            <h5>Français</h5>
            <h4 class="subject-average">13,43</h4>
            <div style="gap: 0.5rem;" class="stats">
                <h6><i class="fa-solid fa-ranking-star"></i> 23/32</h6>
                <h6><i class="fa-solid fa-users"></i> 12,82</h6>
            </div>
        </div>
        <div class="panel subject-panel">
            <h5>EPS</h5>
            <h4 class="subject-average">14,56</h4>
            <div style="gap: 0.5rem;" class="stats">
                <h6><i class="fa-solid fa-ranking-star"></i> 16/32</h6>
                <h6><i class="fa-solid fa-users"></i> 15,79</h6>
            </div>
        </div>
        <div class="panel subject-panel">
            <h5>Histoire</h5>
            <h4 class="subject-average">15,21</h4>
            <div style="gap: 0.5rem;" class="stats">
                <h6><i class="fa-solid fa-ranking-star"></i> 4/32</h6>
                <h6><i class="fa-solid fa-users"></i> 12,45</h6>
            </div>
        </div>
    </div>
    <script src="utils/navbar.js"></script>
    <script>
        const average_chart = document.querySelector('#average-chart');

        const color = "#fff";

        new Chart(average_chart, {
            type: 'line',
            data: {
                labels: ['lundi', 'mardi', 'mercredi', 'jeudi', 'vendredi', 'samedi', 'dimanche'],
                datasets: [{
                    label: '',
                    data: [12, 14, 18, 16, 17, 13, 15],
                    fill: false,
                    borderColor: color,
                    tension: 0.1,
                    pointStyle: false
                }]
            },
            options: {
                scales: {    
                    x: {  
                        ticks:{
                            display: false // Hides only the labels of the x-axis 
                        },
                        grid: {
                            display: false
                        }
                    },
                    y: {
                        ticks:{
                            color: color
                        },
                        grid: {
                            display: false
                        }
                    }
                },
                plugins: {
                    legend: {
                        display: false
                    },
                    title: {
                        display: true,
                        text: 'Moyenne sur 7 jours',
                        color: color
                    }
                },
            }
        });

        const subject_chart = document.querySelector('#subject-chart');

        new Chart(subject_chart, {
            type: 'radar',
            data: {
                labels: ['Maths', 'Physique', 'SVT', 'Anglais', 'Allemand', 'Français', 'EPS'],
                datasets: [{
                    label: '',
                    data: [12, 14, 18, 16, 17, 13, 15],
                    fill: false,
                    borderColor: color,
                    tension: 0.1,
                    pointStyle: false
                }]
            },
            options: {
                scales: {
                    r: {
                        suggestedMin: 0,
                        suggestedMax: 20,
                        angleLines:{
                            display: color
                        },
                        ticks: {
                            color: color,
                            backGround: '#ffffff00'
                        }
                    }
                },
                plugins: {
                    legend: {
                        display: false
                    },
                    title: {
                        display: true,
                        text: 'Moyenne par matière',
                        color: color
                    }
                }
            }
        });
    </script>
</body>
</html>
